name: release

# Tag a commit to ship it:
#   cargo set-version 0.2.0   # or edit Cargo.toml by hand
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]
  # A manual run is a rehearsal: it builds and packages all five targets but
  # uploads nothing, so a broken matrix entry is found without spending a
  # version number. The action reads GITHUB_REF for the tag name and would
  # choke on refs/heads/main, hence the placeholder ref below.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # upload-rust-binary-action only uploads — it will not create the release it
  # uploads into, and fails with "release not found" if one is missing. This job
  # makes it. Skipped on a rehearsal, which uploads nothing anyway.
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    needs: create-release
    # `needs` alone would skip the whole matrix on a rehearsal, because a
    # skipped dependency skips its dependents.
    if: always() && (needs.create-release.result == 'success'
      || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl links statically, so one Linux binary runs on every distro
          # regardless of its glibc. x86_64 needs nothing but `rustup target
          # add`; the action reaches for `cross` on its own for aarch64.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          # macOS builds must happen on macOS: Apple Silicon refuses to run an
          # unsigned binary, and the native linker ad-hoc signs it for us.
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: solitaire-tui
          target: ${{ matrix.target }}
          # .tar.gz everywhere, .zip on Windows — the action's default.
          archive: $bin-$tag-$target
          include: README.md,LICENSE-MIT,LICENSE-APACHE
          checksum: sha256
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/tags/v0.0.0-rehearsal' || '' }}
          token: ${{ secrets.GITHUB_TOKEN }}
