name: release

# Tag a commit to ship it:
#   cargo set-version 0.2.0   # or edit Cargo.toml by hand
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]
  # A manual run is a rehearsal: it builds and packages all five targets but
  # uploads nothing, so a broken matrix entry is found without spending a
  # version number. The action reads GITHUB_REF for the tag name and would
  # choke on refs/heads/main, hence the placeholder ref below.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # upload-rust-binary-action only uploads — it will not create the release it
  # uploads into, and fails with "release not found" if one is missing. This job
  # makes it. Skipped on a rehearsal, which uploads nothing anyway.
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    needs: create-release
    # `needs` alone would skip the whole matrix on a rehearsal, because a
    # skipped dependency skips its dependents.
    if: always() && (needs.create-release.result == 'success'
      || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl links statically, so one Linux binary runs on every distro
          # regardless of its glibc. x86_64 needs nothing but `rustup target
          # add`; the action reaches for `cross` on its own for aarch64.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          # macOS builds must happen on macOS: Apple Silicon refuses to run an
          # unsigned binary, and the native linker ad-hoc signs it for us.
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: solitaire-tui
          target: ${{ matrix.target }}
          # .tar.gz everywhere, .zip on Windows — the action's default.
          archive: $bin-$tag-$target
          include: README.md,LICENSE-MIT,LICENSE-APACHE
          checksum: sha256
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/tags/v0.0.0-rehearsal' || '' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # macOS runners ship with Homebrew, and are Apple Silicon — so the formula can
  # be installed and run on the one platform that cannot be checked anywhere
  # else. This gates the tap push: a formula that does not work never ships.
  formula-check:
    needs: binaries
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the formula for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./packaging/homebrew/update-formula.sh "${GITHUB_REF#refs/tags/v}"
      - name: Audit it
        # Advisory only: audit's house style is aimed at homebrew-core, and a
        # personal tap should not fail a release over a naming preference.
        continue-on-error: true
        run: brew audit --formula ./packaging/homebrew/Formula/solitaire-tui.rb
      - name: Install and run it
        # Installed through a throwaway local tap rather than from a file path:
        # installing a formula by path is exactly the thing Homebrew keeps
        # restricting, and a tap is how it will really be consumed anyway.
        run: |
          brew tap-new local/test --no-git
          cp packaging/homebrew/Formula/solitaire-tui.rb \
            "$(brew --repository local/test)/Formula/"
          brew install local/test/solitaire-tui
          brew test local/test/solitaire-tui
          solitaire-tui --version

  # The formula pins checksums of the archives built above, so it cannot be
  # correct until they exist — which is why the copy in this repository is
  # regenerated here, after the fact, rather than bumped before tagging.
  tap:
    needs: [binaries, formula-check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Regenerate the formula from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./packaging/homebrew/update-formula.sh "${GITHUB_REF#refs/tags/v}"
      - name: Commit it back to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/homebrew/Formula/solitaire-tui.rb
          if git diff --staged --quiet; then
            echo 'formula already current'
          else
            git commit -m "homebrew: solitaire-tui ${GITHUB_REF#refs/tags/v}"
            git push origin main
          fi
      - name: Push it to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # Not a failure: the tap is optional, and a release should not go red
          # because it has not been set up yet.
          if [ -z "$TAP_TOKEN" ]; then
            echo 'HOMEBREW_TAP_TOKEN is not set — skipping the tap push'
            exit 0
          fi
          version="${GITHUB_REF#refs/tags/v}"
          git clone --depth 1 \
            "https://x-access-token:$TAP_TOKEN@github.com/Forsbakk/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp packaging/homebrew/Formula/solitaire-tui.rb tap/Formula/
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/solitaire-tui.rb
          if git diff --staged --quiet; then
            echo 'tap already current'
          else
            git commit -m "solitaire-tui $version"
            # Explicit refspec: if the tap is still an empty repository the
            # clone leaves an unborn branch with no upstream, and a bare
            # `git push` fails or invents the wrong branch name.
            git push origin HEAD:main
          fi
