name: ci

# Prose and packaging changes cannot break the build, so they do not run it —
# including the formula the release workflow commits back to main.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "packaging/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "packaging/**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The rules and layout are pure logic, but the terminal backend is not, so the
  # suite runs on every platform we ship a binary for.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  # Cargo.toml claims rust-version = "1.88" (ratatui 0.30's floor). Prove it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      # The browser build has its own toolchain (wasm-bindgen pins its own
      # floor), so the MSRV promise is the terminal game's alone.

  # The engine must stay free of anything that cannot run in a browser — a
  # crossterm import, a `std::time` call. Checking the browser frontends for
  # wasm checks the engine for wasm with them. The graphical frontend's layout
  # and animation tests are plain Rust, so they run on the host.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p solitaire-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p solitaire-gui --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test -p solitaire-gui
