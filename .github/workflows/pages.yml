name: pages

# The browser builds, published to GitHub Pages on every push to main that
# touches code. It is a static site — Trunk's dist/ — so there is no server to
# run. Neither Markdown nor packaging ends up in it, so pushes touching only
# those skip it.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "packaging/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Pinned: the action's `latest` resolves to trunk 0.19, which ignores
      # `data-wasm-opt-params` in index.html — wasm-opt then rejects the
      # bulk-memory ops rustc emits by default.
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: v0.22.2
      # The card table is the site; the terminal build lives beside it at
      # /tui/, linked from the game menu. Both use relative asset URLs, so
      # neither needs to know where it is mounted.
      - run: trunk build --release
        working-directory: crates/solitaire-gui
      - run: trunk build --release --dist ../solitaire-gui/dist/tui
        working-directory: crates/solitaire-web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/solitaire-gui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
