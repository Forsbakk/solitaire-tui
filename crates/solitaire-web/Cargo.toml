[package]
name = "solitaire-web"
description = "solitaire-tui in the browser, through Ratzilla"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
solitaire-tui-core.workspace = true
ratzilla = "0.3.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
# Ratzilla re-exports web-sys, but not with the events this crate listens for
# itself. Cargo unifies the features, so this is the same web-sys.
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCollection",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Node",
    "WheelEvent",
    "Window",
] }
